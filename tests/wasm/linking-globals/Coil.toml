[package]
name = "wasm-linking-globals"
entry = "main.coil"
source-roots = ["."]

[dependencies]
wasm = { path = "../../../src/dialects/wasm" }

[readers]
".wasm" = "experiments.wasm.reader"

[metaprograms]
use = ["experiments.wasm.lang"]

[modules]
"Mg" = "mg.wasm"
"Ng" = "ng.wasm"
"G1" = "g1.wasm"
"G2" = "g2.wasm"
