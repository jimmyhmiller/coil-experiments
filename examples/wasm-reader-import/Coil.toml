[package]
name = "wasm-reader-import-poc"
entry = "main.coil"
source-roots = ["."]

[dependencies]
wasm = { path = "../../src/dialects/wasm" }

# Coil dispatches module files with this extension to the reader provider.
[readers]
".wat" = "experiments.wasm.reader"

# Makes the reader provider available while compiling this project.
[metaprograms]
use = ["experiments.wasm.lang"]

# The imported Coil module below is backed by a WebAssembly text file.
[modules]
"poc.wasm.checksum" = "checksum.wat"
