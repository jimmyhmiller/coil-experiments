# A workspace, not a package: this repo holds independent experiments and has no
# entry point of its own. The workspace name is the first segment of every
# member's namespace, so a module in the `scheme` member is `experiments.scheme.*`.
[workspace]
name    = "experiments"
members = ["src/apps/*", "src/dialects/*", "src/experiments/*"]

[manifest.providers]
c = "experiments.c.reader"

[readers]
".h" = "experiments.c.reader"

[modules]
"experiments.raylib-demo.raylib" = "vendor/raylib/src/raylib.h"

[c.raylib]
sources = [
  "vendor/raylib/src/rcore.c",
  "vendor/raylib/src/rshapes.c",
  "vendor/raylib/src/rtextures.c",
  "vendor/raylib/src/rtext.c",
  "vendor/raylib/src/rmodels.c",
  "vendor/raylib/src/raudio.c",
  "vendor/raylib/src/utils.c",
]
include-paths = [
  "vendor/raylib/src",
  "/opt/homebrew/opt/sdl2-compat/include/SDL2",
  "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include",
  "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21/include",
  "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks",
]
prefixes = [
  "src/dialects/c/target/darwin-arm64.h",
  "src/dialects/c/target/builtins.h",
]
defines = [
  "STBIR_NO_SIMD",
  "MA_NO_NEON",
  "MA_DR_FLAC_NO_NEON",
  "DR_MP3_NO_SIMD",
  "__ARM_NEON_H",
  "__ARM_BF16_H",
  "SDL_DISABLE_ARM_NEON_H",
  "PLATFORM_DESKTOP_SDL",
  "GRAPHICS_API_OPENGL_33",
  "_FORTIFY_SOURCE=0",
]

[link]
frameworks = ["AppKit", "QuartzCore", "CoreGraphics", "CoreText", "CoreVideo", "ImageIO", "CoreFoundation", "Metal", "OpenGL", "CoreAudio", "AudioToolbox"]
libs = ["objc", "SDL2"]
# Heap-inspector applications embed Coil's in-process JIT and export native
# callbacks which its loader resolves from the host executable.
flags = ["-Wl,-export_dynamic"]

# The Scheme dialect's own unit tests -- heap, symbols, numerics, ports, eval,
# continuations, the syntax layer. 191 tests, no external tools needed.
[test.suites.scheme]
roots = ["src/apps/scheme"]
suffixes = ["_test.coil"]

# Structural C declarator parsing and compatibility checks. These are ordinary
# Coil unit tests and do not invoke Clang.
[test.suites.c]
roots = ["src/dialects/c"]
suffixes = ["_test.coil"]

# Phase-level tests for the Carp compiler metaprogram. The external upstream
# compatibility corpus is driven separately by scripts/carp-progress.py.
[test.suites.carp]
roots = ["src/dialects/carp"]
suffixes = ["_test.coil"]

[test.suites.dependent]
roots = ["src/experiments/dependent"]
suffixes = ["_test.coil"]

[test.suites.borrow-checker]
roots = ["src/experiments/borrow-checker"]
suffixes = ["_test.coil"]

[test.suites.heap-inspector]
roots = ["src/experiments/heap-inspector"]
suffixes = ["_test.coil"]

[test.suites.coil-gpui]
roots = ["src/experiments/coil_gpui"]
suffixes = ["_test.coil"]

# MAL (Make-a-Lisp) implemented in the Scheme dialect, staged. Opt-in: the later
# stages are slow, and several are red right now.
[test.suites.mal]
roots = ["tests/scheme/apps"]
suffixes = ["_test.coil"]
default = false
