# The bouncing-ball demo as a live program. The two `live` lines below are all
# it takes to make a program live; see README.md.
[package]
name = "live-demo"
entry = "balls.coil"

[dependencies]
live = { path = "../live" }
invaders = { path = "../../apps/invaders" }   # experiments.invaders.objc

[metaprograms]
use = ["experiments.live.enable"]

# CALayer and CATransaction; invaders brings AppKit, CoreGraphics and objc.
[link]
frameworks = ["QuartzCore"]
