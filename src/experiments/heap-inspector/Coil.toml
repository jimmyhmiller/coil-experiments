[package]
name = "heap-inspector"

# The native application embeds Coil's in-process JIT. Host callbacks exported
# with `export-c` must therefore be visible to the loader in the host process.
[dependencies]
# What a program says to the live host: the :live/on-publish annotation and the
# hook registry. Carries no live machinery of its own.
live-hooks = { path = "../live-hooks" }

[link]
flags = ["-Wl,-export_dynamic"]
