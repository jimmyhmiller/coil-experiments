<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coil · Heap Inspector</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/allocations"><span class="mark">C</span><span><strong>coil</strong><small>heap inspector</small></span></a>
      <div class="connection"><i id="live-dot"></i><span id="connection-label">connecting</span></div>
      <div class="top-stats" id="top-stats"></div>
      <div class="toolbar">
        <label class="search"><span>⌕</span><input id="search" placeholder="Filter types, IDs, addresses…" autocomplete="off"></label>
        <button id="pause" class="icon-button" title="Pause live refresh">Ⅱ</button>
        <button id="refresh" class="icon-button" title="Refresh now">↻</button>
      </div>
    </header>
    <aside class="rail">
      <div class="rail-label">Explore</div>
      <button class="nav-item selected" data-view="allocations"><span class="nav-icon">⌘</span>Allocations<span id="all-count" class="badge">0</span></button>
      <div class="rail-label types-label type-filter-label"><span>Types</span><select id="zero-types" title="Type visibility"><option value="hide">Allocated only</option><option value="show">Include zero-region</option></select></div>
      <div id="types" class="type-list"></div>
      <div class="rail-note">Protocol-live memory from <code>coil.alloc</code>. Stack, static, primitive, and foreign allocations are outside this census.</div>
    </aside>
    <main class="workspace">
      <section class="overview" id="overview"></section>
      <section class="heap-panel panel" id="heap-panel">
        <div class="panel-head"><div><span class="kicker">Address space</span><h2>Live heap map</h2></div><span class="hint">size-weighted · address ordered</span></div>
        <div id="heap-map" class="heap-map"></div>
      </section>
      <section class="content-panel panel">
        <div class="panel-head content-head">
          <div><span class="kicker" id="content-kicker">Allocation census</span><h2 id="title">All live allocations</h2></div>
          <div class="table-tools"><span id="visible-count"></span><select id="sort"><option value="id">Newest</option><option value="bytes">Largest</option><option value="address">Address</option><option value="type">Type</option></select></div>
        </div>
        <div id="content"></div>
      </section>
    </main>
    <aside id="detail" class="detail" aria-hidden="true"></aside>
    <div id="toast" class="toast"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
