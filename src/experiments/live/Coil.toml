[package]
name = "live"

# Make any Coil program live by adding this package as a dependency and one
# manifest line:
#
#   [dependencies]
#   live = { path = ".../coil-experiments/src/experiments/live" }
#
#   [metaprograms]
#   use = ["experiments.live.enable"]
#
# The live host embeds Coil's in-process JIT (linked from the toolchain's
# prebuilt coil.jit unit). JIT-compiled application code resolves the host's
# `coil_live_*` entry points through the loader, so they must be exported.
[dependencies]
heap-inspector = { path = "../heap-inspector" }
live-repl = { path = "../live-repl" }

[link]
flags = ["-Wl,-export_dynamic"]
