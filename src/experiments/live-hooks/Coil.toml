[package]
name = "live-hooks"

# What a program says to the live host, and nothing else. A program depends on
# this to declare or register a code-change hook; it does NOT pull in the live
# host, the in-process compiler, or any of the machinery that applies an edit.
#
#   [dependencies]
#   live-hooks = { path = ".../coil-experiments/src/experiments/live-hooks" }
#
# Built without the live package, everything here is inert: the annotation is
# metadata nobody reads, and the registered pointer is a static nobody calls.
