  "../../dialects/c/target/darwin-arm64.h",
  "../../dialects/c/target/builtins.h",
]
defines = [
  "HAVE_CONFIG_H",
  "BYTE_CODE_SAFE=1",
  "FT_SIZEOF_INT=4",
  "FT_SIZEOF_LONG=8",
  "FT_SIZEOF_LONG_LONG=8",
]
header-defines = []

[link]
libs = ["xml2", "ncurses", "freetype", "fontconfig", "harfbuzz", "gnutls", "lcms2", "z", "tree-sitter", "sqlite3", "jimbackend"]
search-paths = [
