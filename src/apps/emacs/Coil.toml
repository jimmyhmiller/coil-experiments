  "target/darwin-arm64/lib",
  "vendor/emacs/src",
  "vendor/emacs/lib",
  "vendor/emacs/lib/malloc",
  "/opt/homebrew/opt/llvm/include",
  "/opt/homebrew/opt/openssl@3/include",
  "/opt/homebrew/opt/gnutls/include",
  "/opt/homebrew/opt/freetype/include/freetype2",
  "/opt/homebrew/opt/fontconfig/include",
  "/opt/homebrew/opt/harfbuzz/include/harfbuzz",
  "/opt/homebrew/opt/libxml2/include/libxml2",
  "/opt/homebrew/opt/little-cms2/include",
  "/opt/homebrew/opt/tree-sitter/include",
  "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include",
  "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21/include",
  "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks",
]
