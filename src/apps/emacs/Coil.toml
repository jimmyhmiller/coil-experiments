[package]
name = "emacs"
entry = "main.coil"
source-roots = [".", "../../dialects/c"]

[build]
out = "emacs-coil"
optimization = 2

[manifest.providers]
c = "experiments.c.reader"

[readers]
".h" = "experiments.c.reader"

[modules]
"experiments.emacs.core" = "emacs.h"

