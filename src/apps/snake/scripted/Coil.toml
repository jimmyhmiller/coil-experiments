# The snake game, linked against a scripted window instead of SDL. Test tooling for
# the key-press probes: same Coil sources, no display, deterministic key presses.
[package]
name = "snake-scripted"
entry = "../src/main.coil"
source-roots = ["../src", "../probes"]

[dependencies]
probe = { path = "../../../experiments/probe" }

[cc]
sources = ["scripted_window.c"]
flags = ["-std=c11", "-Wall", "-Wextra"]
