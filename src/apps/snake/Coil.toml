[package]
name = "snake"
entry = "src/main.coil"
source-roots = ["src", "tests", "probes"]

# The game itself knows nothing about probes. This one dependency is what lets
# `coil run --use snake.probes.keys` work: probe's manifest brings the `.probe`
# reader with it.
[dependencies]
probe = { path = "../../experiments/probe" }

[cc]
sources = ["native/snake_window.c"]
include-dirs = ["native", "/opt/homebrew/include"]
flags = ["-std=c11", "-Wall", "-Wextra"]

[link]
libs = ["SDL2"]
search-paths = ["/opt/homebrew/lib"]

[test]
roots = ["tests"]
suffixes = ["_test.coil"]
